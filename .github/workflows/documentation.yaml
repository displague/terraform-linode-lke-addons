name: generate-terraform-docs
# This workflow will generate terraform docs into README.md in the root, examples, and modules folders.
# Source: https://github.com/equinix-labs/terraform-equinix-kubernetes-addons/blob/main/.github/workflows/documentation.yaml

on:
  pull_request:
    paths:
      - '**/*.tpl'
      - '**/*.tf'
      - '**/README.md'
      - '.github/workflows/documentation.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.tpl'
      - '**/*.tf'

jobs:
  # Pull requests: fail if the README tables are stale for the .tf changes
  # in the PR. Regenerate locally with:
  #   terraform-docs markdown table --output-file README.md --output-mode inject --recursive --recursive-path modules .
  # (or `terraform-docs --recursive .` with the same flags this job passes).
  check:
    name: TF docs up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1.0.0
        with:
          find-dir: .
          args: --sort-by required
          indention: 2
          git-push: "false"
          fail-on-diff: "true"

  # Pushes to main: regenerate and open/update ONE PR on the stable
  # bot/generate-terraform-docs branch (see #32).
  tf-docs:
    name: TF docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        id: actions-checkout
        with:
          ref: main

      - name: Render terraform docs inside the main and the modules README.md files and push changes back to PR branch
        id: terraform-docs
        uses: terraform-docs/gh-actions@v1.0.0
        with:
          find-dir: .
          args: --sort-by required
          indention: 2
          git-push: "false"

      # terraform-docs/gh-actions@v1.0.0 modifies .git files with owner root:root, and the following steps fail with
      # insufficient permission for adding an object to repository database .git/objects
      # since the expected user is runner:docker. See https://github.com/terraform-docs/gh-actions/issues/90
      - name: Fix .git owner
        run: sudo chown runner:docker -R .git

      - name: Create Pull Request
        if: steps.terraform-docs.outputs.num_changed != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'generate-terraform-docs: automated action'
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          title: 'generate-terraform-docs: automated action'
          body: |
            Update terraform docs
          # Stable branch name — the action UPSERTs a PR onto this branch,
          # so back-to-back doc-regen runs update the existing open PR
          # instead of cascading new ones that conflict with each other.
          branch: bot/generate-terraform-docs
          base: main
          signoff: true
          delete-branch: true

      # TODO(ocobleseqx): https://github.com/peter-evans/enable-pull-request-automerge
