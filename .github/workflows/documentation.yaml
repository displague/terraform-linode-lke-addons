name: generate-terraform-docs
# Keeps the terraform-docs tables in README.md (root + modules) current.
#
# One pinned terraform-docs version is used by the PR check, the regen job
# and (by convention) local runs — flags live in .terraform-docs.yml so
# `terraform-docs .` produces byte-identical output everywhere. Formatting
# differs between terraform-docs versions (e.g. table separators), so don't
# mix versions.

on:
  pull_request:
    paths:
      - '**/*.tpl'
      - '**/*.tf'
      - '**/README.md'
      - '.terraform-docs.yml'
      - '.github/workflows/documentation.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.tpl'
      - '**/*.tf'
      - '.terraform-docs.yml'

env:
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  # Pull requests: fail if the README tables are stale for the changes in
  # the PR. Regenerate locally with `terraform-docs .` (same pinned version).
  check:
    name: TF docs up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terraform-docs
        run: |
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin terraform-docs
          terraform-docs --version
      - name: Render docs
        run: terraform-docs .
      - name: Fail on diff
        run: |
          if ! git diff --quiet -- '*.md'; then
            echo "::error::README tables are stale. Run 'terraform-docs .' (terraform-docs ${TERRAFORM_DOCS_VERSION}) and commit."
            git --no-pager diff -- '*.md'
            exit 1
          fi

  # Pushes to main: regenerate and open/update ONE PR on the stable
  # bot/generate-terraform-docs branch.
  tf-docs:
    name: TF docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install terraform-docs
        run: |
          curl -sSL "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin terraform-docs
      - name: Render docs
        run: terraform-docs .
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'generate-terraform-docs: automated action'
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          title: 'generate-terraform-docs: automated action'
          body: |
            Update terraform docs
          # Stable branch name — the action UPSERTs a PR onto this branch, so
          # back-to-back doc-regen runs update the existing open PR instead of
          # cascading new ones that conflict with each other.
          branch: bot/generate-terraform-docs
          base: main
          signoff: true
          delete-branch: true
